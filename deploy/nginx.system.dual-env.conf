# System Nginx configuration for one VPS hosting both production and staging.
# Place at: /etc/nginx/sites-available/darital
# Symlink to: /etc/nginx/sites-enabled/darital
#
# Production ports:
#   admin  -> 127.0.0.1:3000
#   api    -> 127.0.0.1:3001
#   tenant -> 127.0.0.1:3002
#
# Staging ports:
#   admin  -> 127.0.0.1:3100
#   api    -> 127.0.0.1:3101
#   tenant -> 127.0.0.1:3102

server {
    listen 80;
    server_name api.darital-arenda.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        client_max_body_size 100M;
    }
}

