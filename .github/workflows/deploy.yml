name: Build & Deploy

# Builds the Docker images in CI (fast + cached) and pushes them to GHCR, then
# deploys by having the VPS PULL the prebuilt images instead of building them.
# This removes all compilation + npm downloads from the production server, so
# deploys take seconds and never compete with the live app.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/darital

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.api
            build_args: ""
          - image: tenant
            dockerfile: Dockerfile.tenant
            build_args: "NEXT_PUBLIC_API_URL=/api"
          - image: admin-staging
            dockerfile: Dockerfile.admin
            build_args: "NEXT_PUBLIC_API_URL=https://staging-api.darital-arenda.uz/api"
          - image: admin-prod
            dockerfile: Dockerfile.admin
            build_args: "NEXT_PUBLIC_API_URL=https://api.darital-arenda.uz/api"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.image }}:latest
            ${{ env.IMAGE_BASE }}-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy via SSH (pull prebuilt images — no build on server)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEPLOY_ENV="${{ github.event.inputs.environment || 'staging' }}"
            export IMAGE_TAG="${{ github.sha }}"
            export IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/darital"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            if [ "$DEPLOY_ENV" = "production" ]; then
              cd /srv/darital-prod
              export ADMIN_IMAGE="$IMAGE_BASE-admin-prod"
              C="docker compose -p darital-production -f docker-compose.prod.yml -f docker-compose.vps.yml -f docker-compose.registry.yml --env-file env.production"
            else
              cd /srv/darital-staging
              export ADMIN_IMAGE="$IMAGE_BASE-admin-staging"
              C="docker compose -p darital-staging -f docker-compose.prod.yml -f docker-compose.staging.yml -f docker-compose.vps.staging.yml -f docker-compose.registry.yml --env-file env.staging"
            fi
            $C pull
            $C up -d
            docker image prune -f
