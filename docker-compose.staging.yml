services:
  minio:
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"

  api:
    env_file: env.staging
    ports:
      - "127.0.0.1:3101:3001"

  admin-web:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://staging-api.darital-arenda.uz/api}
    ports:
      - "127.0.0.1:3100:3000"

  tenant-web:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://staging-api.darital-arenda.uz/api}
    ports:
      - "127.0.0.1:3102:3002"
