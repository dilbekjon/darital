# Pull-based deploy override: point services at prebuilt registry images instead
# of building on the server. Applied LAST in the deploy command. The image refs
# are supplied via env vars by the CI deploy job, so this works with ANY registry
# (GitHub GHCR, GitLab Container Registry, Docker Hub, …).
services:
  api:
    image: ${API_IMAGE:-ghcr.io/dilbekjon/darital-api:latest}
    pull_policy: always
  admin-web:
    image: ${ADMIN_IMAGE:-ghcr.io/dilbekjon/darital-admin-staging:latest}
    pull_policy: always
  tenant-web:
    image: ${TENANT_IMAGE:-ghcr.io/dilbekjon/darital-tenant:latest}
    pull_policy: always
